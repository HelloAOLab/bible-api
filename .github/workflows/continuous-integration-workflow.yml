name: Continuous Integration

on:
    push:

jobs:
    test:
        name: Test and Build
        strategy:
            matrix:
                os: [ubuntu-latest, macOS-latest]
                node-version: [22.x]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v1
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v1
              with:
                  node-version: ${{ matrix.node-version }}
            - name: npm install and test
              run: |
                  corepack enable
                  pnpm install
                  npx --node-options="--max_old_space_size=4096" jest --detectOpenHandles --forceExit --no-cache
                  npm run build
                  npm run build:docs
              env:
                  CI: true

    audio-timings:
        name: Audio Timings Tool
        runs-on: ubuntu-latest
        env:
            CI: true
        defaults:
            run:
                working-directory: tools/audio-timings
        steps:
            - uses: actions/checkout@v4
            - name: Install uv
              uses: astral-sh/setup-uv@v5
            # The `asr` extra (whisperX and torch) is deliberately left out: the
            # tests drive the pipeline from recorded ASR word streams, so they
            # need no model, no GPU and no network.
            - name: Install dependencies
              run: uv sync --group dev
            - name: Lint
              run: uv run ruff check src tests
            - name: Test
              run: uv run pytest -q
