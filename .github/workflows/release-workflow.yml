name: Release

# Builds, tests, and publishes the public packages to NPM:
#   - @helloao/tools              (packages/helloao-tools)
#   - @helloao/cli                (packages/helloao-cli)
#   - free-use-bible-api          (packages/free-use-bible-api)
#   - free-use-bible-api-react    (packages/free-use-bible-api-react)
#
# To release, bump the "version" in the package.json of each package that
# should be published, merge it, and then publish a GitHub release (or run
# this workflow manually). Only packages whose version is not already on NPM
# are published, so unchanged packages are skipped. Private packages are
# never published.
#
# Packages are published with NPM trusted publishing (OIDC), so each package
# needs a trusted publisher configured on npmjs.com for this repository and
# the release-workflow.yml workflow. Trusted publishers can only be added to
# packages that already exist, so the first version of a new package has to be
# published some other way: either publish it by hand, or set an NPM_TOKEN
# repository secret with publish access, which is used when it is present.

on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            dry-run:
                description: 'Build, test, and pack without publishing to NPM'
                type: boolean
                default: true

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    release:
        name: Build, Test, and Publish
        runs-on: ubuntu-latest
        permissions:
            contents: read
            # Needed to generate NPM provenance attestations.
            id-token: write
        env:
            CI: true
        steps:
            - uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4

            - name: Use Node.js 24.x
              uses: actions/setup-node@v4
              with:
                  node-version: 24.x
                  cache: pnpm
                  registry-url: 'https://registry.npmjs.org'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Test
              run: npx --node-options="--max_old_space_size=4096" jest --detectOpenHandles --forceExit --no-cache

            - name: Build
              run: npm run build

            # Trusted publishing does not work for packages that are not on NPM yet,
            # so check for them before anything is published. Otherwise the release
            # fails halfway through and only some of the packages get published.
            - name: Check that new packages can be published
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
                  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
              run: |
                  level=error
                  if [ "$DRY_RUN" = "true" ]; then level=warning; fi
                  failed=false
                  for name in $(pnpm ls -r --depth -1 --json | jq -r '.[] | select(.private | not) | .name'); do
                      if ! output=$(npm view "$name" name 2>&1); then
                          if ! grep -q E404 <<< "$output"; then
                              echo "$output"
                              echo "::error::Could not check whether $name is on NPM."
                              exit 1
                          fi
                          if [ -z "$NODE_AUTH_TOKEN" ]; then
                              echo "::$level::$name is not on NPM yet, so it can't be published with trusted publishing. Publish its first version by hand (or set the NPM_TOKEN secret), add a trusted publisher for it on npmjs.com, and then run this workflow again."
                              failed=true
                          fi
                      fi
                  done
                  if [ "$failed" = "true" ] && [ "$level" = "error" ]; then
                      exit 1
                  fi

            - name: Publish to NPM (dry run)
              if: github.event_name == 'workflow_dispatch' && inputs.dry-run
              run: pnpm publish -r --access public --no-git-checks --dry-run

            - name: Publish to NPM
              if: github.event_name == 'release' || !inputs.dry-run
              run: pnpm publish -r --access public --no-git-checks --report-summary
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
                  NPM_CONFIG_PROVENANCE: true

            - name: Publish summary
              if: github.event_name == 'release' || !inputs.dry-run
              run: |
                  {
                      echo '## Published packages'
                      echo
                      jq -r 'if (.publishedPackages | length) == 0
                          then "No new package versions to publish."
                          else .publishedPackages[] | "- `\(.name)@\(.version)`" end' pnpm-publish-summary.json
                  } >> "$GITHUB_STEP_SUMMARY"
